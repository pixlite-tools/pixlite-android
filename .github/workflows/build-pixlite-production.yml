name: Build PixLite TEST 26

on:
  workflow_dispatch:
  push:
    branches:
      - claude/pixlite-scanner-quality-49f1s3
    paths:
      - "pixlite_production/**"
      - ".github/workflows/build-pixlite-production.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true

      - name: Flutter dependencies
        working-directory: pixlite_production
        run: |
          flutter --version
          flutter pub get

      - name: Apply and VERIFY PixLite TEST 26 source
        working-directory: pixlite_production
        run: |
          python3 tooling/pixlite_style_v26.py
          python3 tooling/pixlite_build_fix.py
          python3 tooling/pixlite_ci_verify.py
          grep -n "PDF & Document Tools • TEST 26" lib/main.dart
          grep -n "class PixLiteMark" lib/main.dart
          grep -n "const kOrange = Color(0xFFFF8500)" lib/main.dart
          grep -n "Icons.campaign_rounded,color:kOrange" lib/main.dart
          test "$(grep -o "bottomAd:BannerAdBox(label:widget.tr('ad'),adUnitId:AdIds.toolBottomBanner)" lib/main.dart | wc -l)" -ge 5
          grep -n "AdIds.homeTopBanner" lib/main.dart
          grep -n "AdIds.homeInlineBanner" lib/main.dart
          grep -n "AdIds.homeBottomBanner" lib/main.dart
          grep -n "class OutputStore" lib/main.dart

      - name: Persist verified TEST 26 app source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pixlite_production/lib/main.dart
          if ! git diff --cached --quiet; then
            git commit -m "Persist verified PixLite TEST 26 source [skip ci]"
            git push
          else
            echo "Verified source already persisted."
          fi

      - name: Create Android shell
        working-directory: pixlite_production
        run: flutter create --platforms=android --org com.pixlite .

      - name: Configure Android
        working-directory: pixlite_production
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          head = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms = '''
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
          '''
          if "android.permission.INTERNET" not in text:
              text = text.replace(head, head + perms)
          text = text.replace('android:label="pixlite"', 'android:label="PixLite TEST 26"')
          text = text.replace('android:label="pixlite_production"', 'android:label="PixLite TEST 26"')
          admob = '''
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-8892609279215644~8049200739"/>
          '''
          if "com.google.android.gms.ads.APPLICATION_ID" not in text:
              text = text.replace("<activity", admob + "\n        <activity", 1)
          manifest.write_text(text)

          for path in [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]:
              if not path.exists():
                  continue
              s = path.read_text()
              s = s.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
              s = s.replace("targetSdk = flutter.targetSdkVersion", "targetSdk = 36")
              s = s.replace("minSdk = flutter.minSdkVersion", "minSdk = 21")
              s = s.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
              s = s.replace("targetSdkVersion flutter.targetSdkVersion", "targetSdkVersion 36")
              s = s.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 21")
              path.write_text(s)

          kts = Path("android/app/build.gradle.kts")
          if kts.exists():
              kts.write_text(kts.read_text() + '''

          android {
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }
          }
          ''')

          Path("android/app/proguard-rules.pro").write_text('''
          -keep class io.flutter.** { *; }
          -keep class io.flutter.plugins.** { *; }
          -keep class com.google.mlkit.** { *; }
          -keep class com.google.android.gms.** { *; }
          -dontwarn com.google.mlkit.**
          -dontwarn com.google.android.gms.**
          -dontwarn com.google.android.play.core.splitcompat.**
          -dontwarn com.google.android.play.core.splitinstall.**
          -dontwarn com.google.android.play.core.tasks.**
          ''')
          PY

      - name: Generate launcher icon and splash
        working-directory: pixlite_production
        run: |
          python3 -m pip install pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          src = Path("assets/pixlite_icon.png")
          im = Image.open(src).convert("RGBA")
          res = Path("android/app/src/main/res")
          for folder, size in {"mipmap-mdpi":48,"mipmap-hdpi":72,"mipmap-xhdpi":96,"mipmap-xxhdpi":144,"mipmap-xxxhdpi":192}.items():
              out=res/folder; out.mkdir(parents=True,exist_ok=True); im.resize((size,size),Image.LANCZOS).save(out/"ic_launcher.png")
          for folder, size in {"drawable-mdpi":160,"drawable-hdpi":240,"drawable-xhdpi":320,"drawable-xxhdpi":480,"drawable-xxxhdpi":640}.items():
              out=res/folder; out.mkdir(parents=True,exist_ok=True)
              canvas=Image.new("RGBA",(size,size),(0,0,0,0)); mark=im.copy(); mark.thumbnail((int(size*.72),int(size*.72)),Image.LANCZOS)
              canvas.alpha_composite(mark,((size-mark.width)//2,(size-mark.height)//2)); canvas.save(out/"pixlite_splash.png")
          drawable=res/"drawable"; drawable.mkdir(parents=True,exist_ok=True)
          (drawable/"launch_background.xml").write_text('''<?xml version="1.0" encoding="utf-8"?><layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:drawable="#050814"/><item><bitmap android:gravity="center" android:src="@drawable/pixlite_splash"/></item></layer-list>''')
          v31=res/"values-v31"; v31.mkdir(parents=True,exist_ok=True)
          (v31/"styles.xml").write_text('''<?xml version="1.0" encoding="utf-8"?><resources><style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar"><item name="android:windowSplashScreenBackground">#050814</item><item name="android:windowSplashScreenAnimatedIcon">@drawable/pixlite_splash</item><item name="android:windowSplashScreenIconBackgroundColor">#050814</item><item name="android:windowNoTitle">true</item></style><style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar"><item name="android:windowBackground">#050814</item></style></resources>''')
          PY

      - name: Analyze verified app source
        working-directory: pixlite_production
        run: flutter analyze lib --no-fatal-infos

      - name: Build uniquely versioned TEST 26 arm64 APK
        working-directory: pixlite_production
        run: flutter build apk --release --target-platform android-arm64 --build-name=1.0.26 --build-number=26

      - name: Prepare TEST 26 artifact
        run: |
          mkdir -p release_files
          cp pixlite_production/build/app/outputs/flutter-apk/app-release.apk release_files/PixLite-TEST-26-arm64.apk
          sha256sum release_files/PixLite-TEST-26-arm64.apk
          ls -lh release_files/PixLite-TEST-26-arm64.apk

      - name: Upload TEST 26 APK
        uses: actions/upload-artifact@v4
        with:
          name: pixlite-TEST-26-arm64
          path: release_files/PixLite-TEST-26-arm64.apk
