name: Build PixLite Production

on:
  workflow_dispatch:
  push:
    branches:
      - claude/pixlite-scanner-quality-49f1s3
    paths:
      - "pixlite_production/**"
      - ".github/workflows/build-pixlite-production.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true

      - name: Flutter dependencies
        working-directory: pixlite_production
        run: |
          flutter --version
          flutter pub get

      - name: Create Android shell
        working-directory: pixlite_production
        run: flutter create --platforms=android --org com.pixlite .

      - name: Configure Android
        working-directory: pixlite_production
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          head = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms = '''
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
          '''
          if "android.permission.INTERNET" not in text:
              text = text.replace(head, head + perms)

          text = text.replace('android:label="pixlite"', 'android:label="PixLite"')
          text = text.replace('android:label="pixlite_production"', 'android:label="PixLite"')

          admob = '''
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-3940256099942544~3347511713"/>
          '''
          if "com.google.android.gms.ads.APPLICATION_ID" not in text:
              text = text.replace("<activity", admob + "\n        <activity", 1)
          manifest.write_text(text)

          for path in [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]:
              if not path.exists():
                  continue
              s = path.read_text()
              s = s.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
              s = s.replace("targetSdk = flutter.targetSdkVersion", "targetSdk = 36")
              s = s.replace("minSdk = flutter.minSdkVersion", "minSdk = 21")
              s = s.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
              s = s.replace("targetSdkVersion flutter.targetSdkVersion", "targetSdkVersion 36")
              s = s.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 21")
              path.write_text(s)

          # Conservative release-size optimizations, appended as a SEPARATE
          # `android { }` configuration block rather than editing the
          # generated block above -- Gradle's Kotlin DSL merges multiple
          # `buildTypes { release { ... } }` invocations, so this only adds
          # minify/shrink + proguard wiring without risking a fragile
          # string-edit of Flutter's own generated release config.
          kts = Path("android/app/build.gradle.kts")
          if kts.exists():
              kts.write_text(kts.read_text() + '''

          android {
              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }
          }
          ''')

          proguard = Path("android/app/proguard-rules.pro")
          proguard.write_text('''# Conservative keep rules for R8 in release builds.
          # Flutter's own engine/plugin embedding classes.
          -keep class io.flutter.app.** { *; }
          -keep class io.flutter.plugin.** { *; }
          -keep class io.flutter.util.** { *; }
          -keep class io.flutter.view.** { *; }
          -keep class io.flutter.** { *; }
          -keep class io.flutter.plugins.** { *; }

          # Google ML Kit document scanner + underlying Play Services --
          # these use reflection-heavy dynamic module loading that R8's
          # static analysis can't always see through.
          -keep class com.google.mlkit.** { *; }
          -keep class com.google.android.gms.** { *; }
          -dontwarn com.google.mlkit.**
          -dontwarn com.google.android.gms.**
          ''')
          PY

      - name: Generate high-quality launcher icon and splash
        working-directory: pixlite_production
        run: |
          python3 -m pip install pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path("assets/pixlite_icon.png")
          im = Image.open(src).convert("RGBA")
          res = Path("android/app/src/main/res")

          launcher_sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, size in launcher_sizes.items():
              out = res / folder
              out.mkdir(parents=True, exist_ok=True)
              im.resize((size, size), Image.LANCZOS).save(out / "ic_launcher.png")

          splash_sizes = {
              "drawable-mdpi": 160,
              "drawable-hdpi": 240,
              "drawable-xhdpi": 320,
              "drawable-xxhdpi": 480,
              "drawable-xxxhdpi": 640,
          }
          for folder, size in splash_sizes.items():
              out = res / folder
              out.mkdir(parents=True, exist_ok=True)
              canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              mark = im.copy()
              mark.thumbnail((int(size * 0.72), int(size * 0.72)), Image.LANCZOS)
              canvas.alpha_composite(mark, ((size - mark.width)//2, (size - mark.height)//2))
              canvas.save(out / "pixlite_splash.png")

          drawable = res / "drawable"
          drawable.mkdir(parents=True, exist_ok=True)
          (drawable / "launch_background.xml").write_text('''<?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="#050814"/>
              <item>
                  <bitmap android:gravity="center" android:src="@drawable/pixlite_splash"/>
              </item>
          </layer-list>''')

          v31 = res / "values-v31"
          v31.mkdir(parents=True, exist_ok=True)
          (v31 / "styles.xml").write_text('''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowSplashScreenBackground">#050814</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/pixlite_splash</item>
                  <item name="android:windowSplashScreenIconBackgroundColor">#050814</item>
                  <item name="android:windowNoTitle">true</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">#050814</item>
              </style>
          </resources>''')
          PY

      - name: Analyze source
        working-directory: pixlite_production
        run: flutter analyze --no-fatal-infos || true

      - name: Build debug APK (before-size baseline)
        working-directory: pixlite_production
        run: flutter build apk --debug

      - name: Build release APK (universal)
        working-directory: pixlite_production
        run: flutter build apk --release

      - name: Build release APK (split per ABI)
        working-directory: pixlite_production
        run: flutter build apk --release --split-per-abi

      - name: Build release AAB
        working-directory: pixlite_production
        run: flutter build appbundle --release

      - name: Size analysis
        working-directory: pixlite_production
        run: |
          set -e
          REPORT=size_report.txt
          {
            echo "=== File sizes ==="
            ls -la build/app/outputs/flutter-apk/*.apk build/app/outputs/bundle/release/*.aab 2>/dev/null
            echo
            for apk in build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/app-release.apk; do
              name=$(basename "$apk")
              echo "=== $name : top-level content breakdown ==="
              rm -rf /tmp/apk_inspect && mkdir -p /tmp/apk_inspect
              unzip -o -q "$apk" -d /tmp/apk_inspect
              du -sh /tmp/apk_inspect/*/ 2>/dev/null | sort -rh
              echo "--- native libs per ABI (if any) ---"
              du -sh /tmp/apk_inspect/lib/*/ 2>/dev/null | sort -rh
              echo "--- 15 largest individual files ---"
              find /tmp/apk_inspect -type f -exec du -b {} + | sort -rn | head -15
              echo
            done
          } | tee "$REPORT"

      - name: Prepare artifacts
        run: |
          mkdir -p release_files
          cp pixlite_production/build/app/outputs/flutter-apk/app-debug.apk \
            release_files/PixLite-production-debug.apk
          cp pixlite_production/build/app/outputs/flutter-apk/app-release.apk \
            release_files/PixLite-production-release-universal.apk
          cp pixlite_production/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            release_files/PixLite-production-release-arm64-v8a.apk || true
          cp pixlite_production/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            release_files/PixLite-production-release-armeabi-v7a.apk || true
          cp pixlite_production/build/app/outputs/flutter-apk/app-x86_64-release.apk \
            release_files/PixLite-production-release-x86_64.apk || true
          cp pixlite_production/build/app/outputs/bundle/release/app-release.aab \
            release_files/PixLite-production-release.aab
          cp pixlite_production/size_report.txt release_files/size_report.txt
          ls -la release_files/

      - name: Upload APK/AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pixlite-production-release-build
          path: release_files/*
