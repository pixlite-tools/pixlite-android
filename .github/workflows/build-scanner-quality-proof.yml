name: Build PixLite Scanner Quality Proof

on:
  workflow_dispatch:
  push:
    branches:
      - claude/pixlite-scanner-quality-49f1s3
    paths:
      - "scanner_quality_proof/**"
      - ".github/workflows/build-scanner-quality-proof.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform & build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        working-directory: scanner_quality_proof
        run: gradle assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p release_files
          cp scanner_quality_proof/app/build/outputs/apk/debug/app-debug.apk \
            release_files/PixLiteScannerQualityProof-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pixlite-scanner-quality-proof-debug-apk
          path: release_files/PixLiteScannerQualityProof-debug.apk
