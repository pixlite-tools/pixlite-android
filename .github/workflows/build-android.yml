name: Build PixLite Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find PixLite v4 zip
        run: |
          ls -la
          ZIP_FILE=$(ls PixLite_Android_v4_CleanSource*.zip | head -n 1)
          echo "ZIP_FILE=$ZIP_FILE" >> $GITHUB_ENV
          echo "Found: $ZIP_FILE"

      - name: Unzip project
        run: |
          mkdir pixlite_source
          unzip "$ZIP_FILE" -d pixlite_source
          find pixlite_source -maxdepth 3 -type f | head -80

      - name: Locate Flutter project
        run: |
          PROJECT_DIR=$(dirname $(find pixlite_source -name pubspec.yaml | head -n 1))
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project dir: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.0"
          channel: stable

      - name: Get Flutter dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Create Android project
        run: |
          cd "$PROJECT_DIR"
          flutter create --platforms=android --org com.pixlite .

      - name: Patch Android manifest
        run: |
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          if 'android.permission.INTERNET' not in text:
              text = text.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  '    <uses-permission android:name="android.permission.INTERNET"/>\n'
                  '    <uses-permission android:name="android.permission.CAMERA"/>\n'
                  '    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n'
                  '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>'
              )

          text = text.replace('android:label="pixlite"', 'android:label="PixLite"')
          text = text.replace('android:label="pixlite_android"', 'android:label="PixLite"')

          admob = '''\n        <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-3940256099942544~3347511713"/>\n'''

          if 'com.google.android.gms.ads.APPLICATION_ID' not in text:
              text = text.replace('<activity', admob + '        <activity', 1)

          path.write_text(text)
          PY

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --debug

      - name: Build release AAB
        run: |
          cd "$PROJECT_DIR"
          flutter build appbundle --release || true

      - name: Prepare release files
        run: |
          mkdir release_files
          cp "$PROJECT_DIR"/build/app/outputs/flutter-apk/*.apk release_files/PixLite-v4-debug.apk
          cp "$PROJECT_DIR"/build/app/outputs/bundle/release/*.aab release_files/PixLite-v4-release.aab || true
          ls -la release_files

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixlite-v4-debug-apk
          path: release_files/PixLite-v4-debug.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixlite-v4-release-aab
          path: release_files/PixLite-v4-release.aab

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="pixlite-v4-test-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create "$TAG" release_files/* \
            --title "PixLite Android v4 Test ${{ github.run_number }}" \
            --notes "PixLite v4 clean test build. Download PixLite-v4-debug.apk for Android testing."
