name: Build PixLite v11 Pro Scanner

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find v11 source ZIP
        run: |
          ZIP_FILE=$(ls PixLite_Android_v11_ProScannerSource*.zip | head -n 1)
          test -n "$ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> $GITHUB_ENV
          echo "Building: $ZIP_FILE"

      - name: Unzip source
        run: |
          rm -rf pixlite_source
          mkdir pixlite_source
          unzip "$ZIP_FILE" -d pixlite_source
          PROJECT_DIR=$(dirname $(find pixlite_source -name pubspec.yaml | head -n 1))
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter 3.38
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.0"
          channel: stable
          cache: true

      - name: Flutter dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter --version
          flutter pub get

      - name: Create Android shell
        run: |
          cd "$PROJECT_DIR"
          flutter create --platforms=android --org com.pixlite .

      - name: Configure Android
        run: |
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()

          head = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'

          perms = '''
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
          '''

          if 'android.permission.INTERNET' not in s:
              s = s.replace(
                  head,
                  head + perms
              )

          s = s.replace(
              'android:label="pixlite"',
              'android:label="PixLite"'
          )

          s = s.replace(
              'android:label="pixlite_android"',
              'android:label="PixLite"'
          )

          admob = '''
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-3940256099942544~3347511713"/>
          '''

          if 'com.google.android.gms.ads.APPLICATION_ID' not in s:
              s = s.replace(
                  '<activity',
                  admob + '        <activity',
                  1
              )

          manifest.write_text(s)

          for path in [
              Path('android/app/build.gradle.kts'),
              Path('android/app/build.gradle')
          ]:
              if not path.exists():
                  continue

              x = path.read_text()

              x = x.replace(
                  'compileSdk = flutter.compileSdkVersion',
                  'compileSdk = 36'
              )

              x = x.replace(
                  'targetSdk = flutter.targetSdkVersion',
                  'targetSdk = 36'
              )

              x = x.replace(
                  'minSdk = flutter.minSdkVersion',
                  'minSdk = 21'
              )

              x = x.replace(
                  'compileSdkVersion flutter.compileSdkVersion',
                  'compileSdkVersion 36'
              )

              x = x.replace(
                  'targetSdkVersion flutter.targetSdkVersion',
                  'targetSdkVersion 36'
              )

              x = x.replace(
                  'minSdkVersion flutter.minSdkVersion',
                  'minSdkVersion 21'
              )

              path.write_text(x)
          PY

      - name: Generate launcher icon
        run: |
          cd "$PROJECT_DIR"

          python3 -m pip install pillow

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path('assets/pixlite_icon.png')
          im = Image.open(src).convert('RGBA')

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }

          base = Path('android/app/src/main/res')

          for folder, size in sizes.items():
              d = base / folder
              d.mkdir(parents=True, exist_ok=True)

              im.resize(
                  (size, size),
                  Image.LANCZOS
              ).save(d / 'ic_launcher.png')
          PY

      - name: Analyze source
        run: |
          cd "$PROJECT_DIR"
          flutter analyze --no-fatal-infos

      - name: Build v11 debug APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --debug

      - name: Prepare artifact
        run: |
          mkdir -p release_files

          cp \
            "$PROJECT_DIR"/build/app/outputs/flutter-apk/app-debug.apk \
            release_files/PixLite-v11-pro-scanner-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pixlite-v11-pro-scanner-debug-apk
          path: release_files/PixLite-v11-pro-scanner-debug.apk
