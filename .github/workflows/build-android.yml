name: Build PixLite v11 Pro Scanner Fixed

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find v11 source ZIP
        run: |
          ls -la
          echo "Searching for PixLite v11 ZIP..."
          ZIP_FILE=$(find . -name "PixLite_Android_v11_ProScannerSource*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: PixLite v11 ZIP not found"
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> $GITHUB_ENV
          echo "Building from: $ZIP_FILE"

      - name: Unzip source
        run: |
          rm -rf pixlite_source
          mkdir pixlite_source
          unzip "$ZIP_FILE" -d pixlite_source
          find pixlite_source -maxdepth 3 -type f | head -120

      - name: Locate Flutter project
        run: |
          PROJECT_DIR=$(dirname $(find pixlite_source -name pubspec.yaml | head -n 1))

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project dir: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.44
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter --version
          flutter pub get

      - name: Create Android project
        run: |
          cd "$PROJECT_DIR"
          flutter create --platforms=android --org com.pixlite .

      - name: Patch v11 source
        run: |
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("lib/main.dart")
          text = path.read_text()

          text = text.replace(".empty()", ".isEmpty")
          text = text.replace("if (mat.isEmpty)", "if (mat.rows == 0 || mat.cols == 0)")
          text = text.replace("if(mat.isEmpty)", "if(mat.rows == 0 || mat.cols == 0)")
          text = text.replace("if (!mat.isEmpty)", "if (mat.rows != 0 && mat.cols != 0)")
          text = text.replace("if(!mat.isEmpty)", "if(mat.rows != 0 && mat.cols != 0)")

          # Keep Slider activeColor. activeThumbColor is not accepted here.
          text = text.replace("activeThumbColor:", "activeColor:")

          path.write_text(text)
          PY

      - name: Patch Android manifest
        run: |
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          head = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'

          permissions = '''
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
          '''

          if "android.permission.INTERNET" not in text:
              text = text.replace(head, head + permissions)

          text = text.replace('android:label="pixlite"', 'android:label="PixLite"')
          text = text.replace('android:label="pixlite_android"', 'android:label="PixLite"')

          admob = '''
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-3940256099942544~3347511713"/>
          '''

          if "com.google.android.gms.ads.APPLICATION_ID" not in text:
              text = text.replace("<activity", admob + "\n        <activity", 1)

          manifest.write_text(text)
          PY

      - name: Patch Android SDK
        run: |
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          for path in [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]:
              if not path.exists():
                  continue

              text = path.read_text()
              text = text.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
              text = text.replace("targetSdk = flutter.targetSdkVersion", "targetSdk = 36")
              text = text.replace("minSdk = flutter.minSdkVersion", "minSdk = 21")
              text = text.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
              text = text.replace("targetSdkVersion flutter.targetSdkVersion", "targetSdkVersion 36")
              text = text.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 21")
              path.write_text(text)
          PY

      - name: Generate launcher icons
        run: |
          cd "$PROJECT_DIR"

          python3 -m pip install pillow

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path("assets/pixlite_icon.png")

          if not src.exists():
              raise SystemExit(0)

          im = Image.open(src).convert("RGBA")
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }

          base = Path("android/app/src/main/res")

          for folder, size in sizes.items():
              out = base / folder
              out.mkdir(parents=True, exist_ok=True)
              im.resize((size, size), Image.LANCZOS).save(out / "ic_launcher.png")
          PY

      - name: Analyze source
        run: |
          cd "$PROJECT_DIR"
          flutter analyze --no-fatal-infos || true

      - name: Build v11 debug APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --debug

      - name: Prepare release files
        run: |
          mkdir -p release_files
          cp "$PROJECT_DIR"/build/app/outputs/flutter-apk/app-debug.apk release_files/PixLite-v11-pro-scanner-debug.apk
          ls -la release_files

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixlite-v11-pro-scanner-debug-apk
          path: release_files/PixLite-v11-pro-scanner-debug.apk
