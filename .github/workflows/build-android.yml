name: Build PixLite Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find PixLite v6 zip
        run: |
          ls -la
          ZIP_FILE=$(ls PixLite_Android_v6_MLKitScannerSource*.zip | head -n 1)
          echo "ZIP_FILE=$ZIP_FILE" >> $GITHUB_ENV
          echo "Found: $ZIP_FILE"

      - name: Unzip project
        run: |
          rm -rf pixlite_source
          mkdir pixlite_source
          unzip "$ZIP_FILE" -d pixlite_source
          find pixlite_source -maxdepth 3 -type f | head -120

      - name: Locate Flutter project
        run: |
          PROJECT_DIR=$(dirname $(find pixlite_source -name pubspec.yaml | head -n 1))
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project dir: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.0"
          channel: stable

      - name: Get Flutter dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Create Android project
        run: |
          cd "$PROJECT_DIR"
          flutter create --platforms=android --org com.pixlite .

      - name: Patch Android manifest and app settings
        run: |
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          if 'android.permission.INTERNET' not in text:
              text = text.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  '    <uses-permission android:name="android.permission.INTERNET"/>\n'
                  '    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n'
                  '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>'
              )

          text = text.replace('android:label="pixlite"', 'android:label="PixLite"')
          text = text.replace('android:label="pixlite_android"', 'android:label="PixLite"')

          admob = '\n        <meta-data\n                      android:name="com.google.android.gms.ads.APPLICATION_ID"\n                      android:value="ca-app-pub-3940256099942544~3347511713"/>\n'

          if 'com.google.android.gms.ads.APPLICATION_ID' not in text:
              text = text.replace('<activity', admob + '        <activity', 1)

          manifest.write_text(text)
          PY

      - name: Patch Android SDK versions for ML Kit scanner
        run: |
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          from pathlib import Path

          for path in [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle")
          ]:
              if path.exists():
                  text = path.read_text()

                  text = text.replace(
                      "compileSdk = flutter.compileSdkVersion",
                      "compileSdk = 36"
                  )
                  text = text.replace(
                      "targetSdk = flutter.targetSdkVersion",
                      "targetSdk = 36"
                  )
                  text = text.replace(
                      "minSdk = flutter.minSdkVersion",
                      "minSdk = 21"
                  )

                  text = text.replace(
                      "compileSdkVersion flutter.compileSdkVersion",
                      "compileSdkVersion 36"
                  )
                  text = text.replace(
                      "targetSdkVersion flutter.targetSdkVersion",
                      "targetSdkVersion 36"
                  )
                  text = text.replace(
                      "minSdkVersion flutter.minSdkVersion",
                      "minSdkVersion 21"
                  )

                  path.write_text(text)
          PY

      - name: Generate launcher icons
        run: |
          cd "$PROJECT_DIR"
          python3 -m pip install pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path("assets/pixlite_icon.png")
          im = Image.open(src).convert("RGBA")

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }

          base = Path("android/app/src/main/res")

          for folder, size in sizes.items():
              out = base / folder
              out.mkdir(parents=True, exist_ok=True)
              im.resize((size, size), Image.LANCZOS).save(out / "ic_launcher.png")
          PY

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --debug

      - name: Build release AAB
        run: |
          cd "$PROJECT_DIR"
          flutter build appbundle --release || true

      - name: Prepare release files
        run: |
          mkdir -p release_files
          cp "$PROJECT_DIR"/build/app/outputs/flutter-apk/*.apk release_files/PixLite-v6-mlkit-debug.apk
          cp "$PROJECT_DIR"/build/app/outputs/bundle/release/*.aab release_files/PixLite-v6-mlkit-release.aab || true
          ls -la release_files

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixlite-v6-mlkit-debug-apk
          path: release_files/PixLite-v6-mlkit-debug.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixlite-v6-mlkit-release-aab
          path: release_files/PixLite-v6-mlkit-release.aab

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="pixlite-v6-mlkit-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create "$TAG" release_files/* \
            --title "PixLite Android v6 MLKit Scanner ${{ github.run_number }}" \
            --notes "PixLite v6 with real ML Kit document scanner. Download PixLite-v6-mlkit-debug.apk for Android testing."
