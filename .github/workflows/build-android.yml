name: Build PixLite Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project zip
        run: |
          ls -la
          ZIP_FILE=$(ls PixLite_Android_v3_BuildReady*.zip | head -n 1)
          echo "ZIP_FILE=$ZIP_FILE" >> $GITHUB_ENV
          echo "Found: $ZIP_FILE"

      - name: Unzip project
        run: |
          mkdir pixlite_source
          unzip "$ZIP_FILE" -d pixlite_source
          find pixlite_source -maxdepth 3 -type f | head -50

      - name: Locate Flutter project
        run: |
          PROJECT_DIR=$(dirname $(find pixlite_source -name pubspec.yaml | head -n 1))
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project dir: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.0"
          channel: stable

      - name: Patch pubspec and get dependencies
        run: |
          cd "$PROJECT_DIR"
          sed -i 's/>=3.10.0 </>=3.10.0-0 </g' pubspec.yaml
          sed -i 's/image_picker: .*/image_picker: ^1.1.2/g' pubspec.yaml
          sed -i 's/image: .*/image: ^4.8.0/g' pubspec.yaml
          sed -i 's/google_mobile_ads: .*/google_mobile_ads: ^7.0.0/g' pubspec.yaml
          sed -i 's/firebase_core: .*/firebase_core: ^3.15.2/g' pubspec.yaml
          sed -i 's/firebase_analytics: .*/firebase_analytics: ^11.6.0/g' pubspec.yaml
          flutter pub get

      - name: Regenerate modern Android project
        run: |
          cd "$PROJECT_DIR"
          rm -rf android
          flutter create --platforms=android --org com.pixlite .

      - name: Patch Android manifest for AdMob and permissions
        run: |
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          if 'android.permission.INTERNET' not in text:
              text = text.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\\n'
                  '    <uses-permission android:name="android.permission.INTERNET"/>\\n'
                  '    <uses-permission android:name="android.permission.CAMERA"/>'
              )

          admob = '''\\n        <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-3940256099942544~3347511713"/>\\n'''

          if 'com.google.android.gms.ads.APPLICATION_ID' not in text:
              text = text.replace('<activity', admob + '        <activity', 1)

          path.write_text(text)
          PY

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --debug

      - name: Build release AAB
        run: |
          cd "$PROJECT_DIR"
          flutter build appbundle --release || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pixlite-debug-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: pixlite-release-aab
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/bundle/release/*.aab
