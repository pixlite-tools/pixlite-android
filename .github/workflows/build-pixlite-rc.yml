name: Build PixLite RC2

on:
  workflow_dispatch:
  push:
    branches:
      - pixlite/test29-no-shrink
    paths:
      - ".github/workflows/build-pixlite-rc.yml"
      - "pixlite_production/tooling/pixlite_release_cleanup.py"
      - "pixlite_production/tooling/pixlite_adflow_rc2.py"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true

      - name: Flutter dependencies
        working-directory: pixlite_production
        run: flutter pub get

      - name: Generate approved PixLite brand asset
        working-directory: pixlite_production
        run: |
          python3 -m pip install pillow
          python3 tooling/pixlite_icon_v30.py

      - name: Apply stable feature set, corrected monetization flow, and release cleanup
        working-directory: pixlite_production
        run: |
          python3 tooling/pixlite_style_v30.py
          python3 tooling/pixlite_theme_v31.py
          python3 tooling/pixlite_privacy_v33.py
          python3 tooling/pixlite_back_v34.py
          python3 tooling/pixlite_adflow_rc2.py
          python3 tooling/pixlite_release_cleanup.py
          python3 tooling/pixlite_build_fix.py
          grep -n "PDF & Document Tools" lib/main.dart
          grep -n "Press back again to exit" lib/main.dart
          grep -n "PrivacyScreen(lang:lang,tr:tr)" lib/main.dart
          grep -n "showAndWaitIfReady" lib/main.dart
          grep -n "Future<void> generateQr" lib/main.dart
          if grep -n "Future.delayed(const Duration(milliseconds:700),InterstitialAdManager.showIfReady)" lib/main.dart; then echo "Old delayed post-share ad flow remains"; exit 1; fi
          if grep -n "TEST " lib/main.dart; then echo "TEST marker found in release source"; exit 1; fi

      - name: Create Android shell
        working-directory: pixlite_production
        run: flutter create --platforms=android --org com.pixlite .

      - name: Configure production Android identity and AdMob
        working-directory: pixlite_production
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest=Path('android/app/src/main/AndroidManifest.xml')
          text=manifest.read_text()
          head='<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms='''
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
          '''
          if 'android.permission.INTERNET' not in text:
              text=text.replace(head,head+perms)
          text=re.sub(r'android:label="[^"]+"','android:label="PixLite"',text,count=1)
          text=text.replace('android:icon="@mipmap/ic_launcher"','android:icon="@mipmap/pixlite_launcher"')
          if 'android:roundIcon=' in text:
              text=re.sub(r'android:roundIcon="[^"]+"','android:roundIcon="@mipmap/pixlite_launcher"',text)
          admob='''
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-8892609279215644~8049200739"/>
          '''
          if 'com.google.android.gms.ads.APPLICATION_ID' not in text:
              text=text.replace('<activity',admob+'\n        <activity',1)
          manifest.write_text(text)

          kts=Path('android/app/build.gradle.kts')
          groovy=Path('android/app/build.gradle')
          for path in [kts,groovy]:
              if not path.exists(): continue
              s=path.read_text()
              s=s.replace('compileSdk = flutter.compileSdkVersion','compileSdk = 36')
              s=s.replace('targetSdk = flutter.targetSdkVersion','targetSdk = 36')
              s=s.replace('minSdk = flutter.minSdkVersion','minSdk = 21')
              s=s.replace('compileSdkVersion flutter.compileSdkVersion','compileSdkVersion 36')
              s=s.replace('targetSdkVersion flutter.targetSdkVersion','targetSdkVersion 36')
              s=s.replace('minSdkVersion flutter.minSdkVersion','minSdkVersion 21')
              s=re.sub(r'namespace\s*=\s*"[^"]+"','namespace = "com.pixlite.pixlite"',s)
              s=re.sub(r'applicationId\s*=\s*"[^"]+"','applicationId = "com.pixlite.pixlite"',s)
              s=re.sub(r'applicationId\s+"[^"]+"','applicationId "com.pixlite.pixlite"',s)
              path.write_text(s)

          for f in list(Path('android/app/src/main/kotlin').rglob('MainActivity.kt')) + list(Path('android/app/src/main/java').rglob('MainActivity.java')):
              src=f.read_text()
              src=re.sub(r'^package\s+[\w.]+', 'package com.pixlite.pixlite', src, count=1, flags=re.M)
              f.write_text(src)

          if kts.exists():
              txt=kts.read_text()
              if 'isMinifyEnabled = false' not in txt:
                  txt += '''

          android {
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }
          }
          '''
                  kts.write_text(txt)
          Path('android/app/proguard-rules.pro').write_text('''
          -keep class io.flutter.** { *; }
          -keep class io.flutter.plugins.** { *; }
          -keep class com.google.mlkit.** { *; }
          -keep class com.google.android.gms.** { *; }
          -dontwarn com.google.mlkit.**
          -dontwarn com.google.android.gms.**
          -dontwarn com.google.android.play.core.**
          ''')
          PY

      - name: Generate launcher resources
        working-directory: pixlite_production
        run: python3 tooling/pixlite_launcher_v30.py

      - name: Verify release identity
        working-directory: pixlite_production
        run: |
          grep -R 'android:label="PixLite"' android/app/src/main/AndroidManifest.xml
          grep -R 'com.pixlite.pixlite' android/app/build.gradle* android/app/src/main/kotlin android/app/src/main/java 2>/dev/null || true
          if grep -R "TEST [0-9]" lib android/app/src/main/AndroidManifest.xml; then echo "TEST marker remains"; exit 1; fi
          grep -n "isMinifyEnabled = false" android/app/build.gradle.kts
          grep -n "isShrinkResources = false" android/app/build.gradle.kts

      - name: Analyze
        working-directory: pixlite_production
        run: flutter analyze lib --no-fatal-infos

      - name: Build RC2 arm64 APK
        working-directory: pixlite_production
        run: flutter build apk --release --target-platform android-arm64 --build-name=1.0.0 --build-number=2

      - name: Verify built APK identity
        working-directory: pixlite_production
        run: |
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/aapt dump badging build/app/outputs/flutter-apk/app-release.apk | head -5
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/aapt dump badging build/app/outputs/flutter-apk/app-release.apk | grep "package: name='com.pixlite.pixlite'"
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/aapt dump badging build/app/outputs/flutter-apk/app-release.apk | grep "application-label:'PixLite'"

      - name: Prepare artifact
        run: |
          mkdir -p release_files
          cp pixlite_production/build/app/outputs/flutter-apk/app-release.apk release_files/PixLite-RC2-arm64.apk
          sha256sum release_files/PixLite-RC2-arm64.apk
          ls -lh release_files/PixLite-RC2-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pixlite-RC2-arm64
          path: release_files/PixLite-RC2-arm64.apk
