name: Build PixLite v12 Premium Pro Scanner

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find v12 source ZIP
        run: |
          echo "Searching for PixLite v12 ZIP..."
          ZIP_FILE=$(find . -name "PixLite_Android_v12_PremiumProScannerSource*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: PixLite v12 ZIP not found"
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Building from: $ZIP_FILE"

      - name: Unzip source
        run: |
          rm -rf pixlite_source
          mkdir pixlite_source
          unzip "$ZIP_FILE" -d pixlite_source
          find pixlite_source -maxdepth 3 -type f | head -120

      - name: Locate Flutter project
        run: |
          PROJECT_DIR=$(dirname "$(find pixlite_source -name pubspec.yaml | head -n 1)")

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project dir: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.44
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter --version
          flutter pub get

      - name: Create Android project
        run: |
          cd "$PROJECT_DIR"
          flutter create --platforms=android --org com.pixlite .

      - name: Configure Android app
        run: |
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          head = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = '''
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
          '''

          if "android.permission.INTERNET" not in text:
              text = text.replace(head, head + permissions)

          text = text.replace('android:label="pixlite"', 'android:label="PixLite"')
          text = text.replace('android:label="pixlite_android"', 'android:label="PixLite"')

          admob = '''
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-3940256099942544~3347511713"/>
          '''
          if "com.google.android.gms.ads.APPLICATION_ID" not in text:
              text = text.replace("<activity", admob + "\n        <activity", 1)

          manifest.write_text(text)

          for path in [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]:
              if not path.exists():
                  continue
              s = path.read_text()
              s = s.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
              s = s.replace("targetSdk = flutter.targetSdkVersion", "targetSdk = 36")
              s = s.replace("minSdk = flutter.minSdkVersion", "minSdk = 21")
              s = s.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
              s = s.replace("targetSdkVersion flutter.targetSdkVersion", "targetSdkVersion 36")
              s = s.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 21")
              path.write_text(s)
          PY

      - name: Generate launcher icons
        run: |
          cd "$PROJECT_DIR"
          python3 -m pip install pillow

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path("assets/pixlite_icon.png")
          if not src.exists():
              raise SystemExit("PixLite icon missing")

          im = Image.open(src).convert("RGBA")
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          base = Path("android/app/src/main/res")
          for folder, size in sizes.items():
              out = base / folder
              out.mkdir(parents=True, exist_ok=True)
              im.resize((size, size), Image.LANCZOS).save(out / "ic_launcher.png")
          PY

      - name: Configure premium native splash
        run: |
          cd "$PROJECT_DIR"

          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/values-night
          mkdir -p android/app/src/main/res/values-v31
          mkdir -p android/app/src/main/res/values-night-v31

          cat > android/app/src/main/res/drawable/launch_background.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="#050814" />
              <item>
                  <bitmap
                      android:gravity="center"
                      android:src="@mipmap/ic_launcher" />
              </item>
          </layer-list>
          XML

          cat > android/app/src/main/res/values/styles.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">@drawable/launch_background</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:statusBarColor">#050814</item>
                  <item name="android:navigationBarColor">#050814</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">#050814</item>
                  <item name="android:statusBarColor">#050814</item>
                  <item name="android:navigationBarColor">#050814</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          XML

          cp android/app/src/main/res/values/styles.xml android/app/src/main/res/values-night/styles.xml

          cat > android/app/src/main/res/values-v31/styles.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowSplashScreenBackground">#050814</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@mipmap/ic_launcher</item>
                  <item name="android:windowSplashScreenAnimationDuration">180</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:statusBarColor">#050814</item>
                  <item name="android:navigationBarColor">#050814</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">#050814</item>
                  <item name="android:statusBarColor">#050814</item>
                  <item name="android:navigationBarColor">#050814</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          XML

          cp android/app/src/main/res/values-v31/styles.xml android/app/src/main/res/values-night-v31/styles.xml

      - name: Analyze source
        run: |
          cd "$PROJECT_DIR"
          flutter analyze --no-fatal-infos || true

      - name: Build v12 debug APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --debug

      - name: Prepare release files
        run: |
          mkdir -p release_files
          cp "$PROJECT_DIR"/build/app/outputs/flutter-apk/app-debug.apk release_files/PixLite-v12-premium-pro-scanner-debug.apk
          ls -la release_files

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixlite-v12-premium-pro-scanner-debug-apk
          path: release_files/PixLite-v12-premium-pro-scanner-debug.apk
