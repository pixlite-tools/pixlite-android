name: pixlite
description: PixLite premium Android utility app.
publish_to: "none"
version: 1.0.0+14

environment:
  sdk: ">=3.10.0-0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  image: ^4.8.0
  path_provider: ^2.1.5
  share_plus: ^11.0.0
  pdf: ^3.11.3
  qr_flutter: ^4.1.0
  google_mobile_ads: ^7.0.0
  shared_preferences: ^2.5.3
  google_mlkit_document_scanner: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # assets/pixlite_icon.png is intentionally NOT declared here: it is only
  # ever read directly off disk by the CI workflow to generate native
  # launcher-icon/splash bitmaps at build time. It is never displayed via
  # Flutter's asset system, so bundling it into the app's asset bundle too
  # would just be dead weight in the installed app.
